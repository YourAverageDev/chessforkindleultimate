name = "ultimate-chess-matchmaking"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Two Durable Object classes:
#  - Matchmaker: exactly one instance for the whole deployment (looked up
#    by a fixed name, "global" - see src/index.js). Holds the waiting queue.
#  - GameRoom: one instance per match, looked up by gameId. Holds the
#    authoritative board, move list, and both clocks for that one game.
[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

# Required once, the first time either Durable Object class is deployed -
# tells Cloudflare these are new classes needing storage allocated. Do not
# edit or remove this after your first deploy; add a NEW [[migrations]]
# block (with a new tag) instead if you ever rename or restructure a class.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Matchmaker", "GameRoom"]
